<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/images/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5fe" />
    <title>Sakthi Dental Clinic | Dental Care for Women, Children &amp; Families</title>
    <script>
      // Theme bootstrap — runs before first paint to avoid a flash of the
      // wrong theme. Mirrors src/lib/theme.ts (kept dependency-free).
      ;(function () {
        try {
          var KEY = 'sakthi-theme'
          var raw = localStorage.getItem(KEY)
          var pref = raw === 'light' || raw === 'dark' || raw === 'system' ? raw : 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#17142a' : '#f6f5fe')
        } catch (e) {
          /* storage unavailable — system preference alone decides */
        }
      })()
    </script>
    <meta
      name="description"
      content="Discover compassionate, expert-led dental care for women, children and families at Sakthi Dental Clinic in Hosur."
    />
    <link rel="canonical" href="https://sakthidentalclinic.in/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sakthi Dental Clinic" />
    <meta property="og:title" content="Sakthi Dental Clinic | Dental Care for Women, Children &amp; Families" />
    <meta
      property="og:description"
      content="Discover compassionate, expert-led dental care for women, children and families at Sakthi Dental Clinic in Hosur."
    />
    <meta property="og:url" content="https://sakthidentalclinic.in/" />
    <meta property="og:image" content="https://sakthidentalclinic.in/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sakthi Dental Clinic — specialized dental care for women, children and families in Hosur" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sakthi Dental Clinic | Dental Care for Women, Children &amp; Families" />
    <meta
      name="twitter:description"
      content="Discover compassionate, expert-led dental care for women, children and families at Sakthi Dental Clinic in Hosur."
    />
    <meta name="twitter:image" content="https://sakthidentalclinic.in/images/og-image.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
